<script>
const vistas={inventario:['Inventario','Consultá los transformadores registrados en el distrito.','Listado de transformadores'],movimientos:['Movimientos','Consultá el historial consolidado de movimientos.','Historial de movimientos'],enviados:['Enviados sin informar','Consultá los registros pendientes de informar de 2020.','Registros enviados']};
let vista='inventario', datos=[], filtrados=[], encabezados=[], pagina=0, secuencia=0; const tam=50;
const $=id=>document.getElementById(id);
function cargar(){const solicitud=++secuencia; $('estado').textContent='Cargando…'; $('error').hidden=true; $('refresh').disabled=true; datos=[];encabezados=[];filtrar();google.script.run.withSuccessHandler(r=>{if(solicitud!==secuencia)return;encabezados=r.encabezados;datos=r.filas;$('estado').textContent=r.truncado?'Atención: solo se muestran las primeras '+r.limite+' filas.':'';$('refresh').disabled=false;filtrar()}).withFailureHandler(e=>{if(solicitud!==secuencia)return;$('estado').textContent='';$('error').textContent='No se pudieron cargar los datos: '+(e.message||e);$('error').hidden=false;$('refresh').disabled=false}).obtenerDatos(vista)}
function filtrar(){const q=$('search').value.trim().toLocaleLowerCase('es');filtrados=datos.filter(r=>r.valores.some(v=>String(v).toLocaleLowerCase('es').includes(q)));pagina=0;render()}
function render(){const h=$('head'),b=$('body');h.replaceChildren();b.replaceChildren();if(encabezados.length){const tr=document.createElement('tr');encabezados.forEach(v=>{const th=document.createElement('th');th.textContent=v;tr.append(th)});h.append(tr)}const comienzo=pagina*tam;filtrados.slice(comienzo,comienzo+tam).forEach(r=>{const tr=document.createElement('tr');r.valores.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});b.append(tr)});$('cantidad').textContent=filtrados.length.toLocaleString('es-AR');$('total').textContent=datos.length.toLocaleString('es-AR')+' registros cargados';$('empty').hidden=filtrados.length!==0;$('rango').textContent=filtrados.length?`${comienzo+1}–${Math.min(comienzo+tam,filtrados.length)} de ${filtrados.length}`:'Sin resultados';$('pagina').textContent=`${pagina+1} / ${Math.max(1,Math.ceil(filtrados.length/tam))}`;$('prev').disabled=pagina===0;$('next').disabled=comienzo+tam>=filtrados.length}
document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{vista=btn.dataset.view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===btn));[$('titulo').textContent,$('subtitulo').textContent,$('tabla-titulo').textContent]=vistas[vista];$('search').value='';$('nuevo').hidden=vista!=='inventario';cargar()}));$('search').addEventListener('input',filtrar);$('refresh').addEventListener('click',cargar);$('prev').addEventListener('click',()=>{if(pagina>0){pagina--;render()}});$('next').addEventListener('click',()=>{if((pagina+1)*tam<filtrados.length){pagina++;render()}});
$('nuevo').addEventListener('click',()=>{$('formerror').hidden=true;$('modal').showModal()});
$('cancelar').addEventListener('click',()=>$('modal').close());
$('ingreso').addEventListener('submit',e=>{e.preventDefault();if(!confirm('¿Confirmás el ingreso? Se escribirán datos en tres hojas de la planilla configurada.'))return;const valores=Object.fromEntries(new FormData(e.target).entries());$('guardar').disabled=true;$('cancelar').disabled=true;$('formerror').hidden=true;google.script.run.withSuccessHandler(r=>{$('guardar').disabled=false;$('cancelar').disabled=false;$('modal').close();e.target.reset();alert(r.mensaje);cargar()}).withFailureHandler(err=>{$('guardar').disabled=false;$('cancelar').disabled=false;$('formerror').textContent=err.message||String(err);$('formerror').hidden=false}).registrarIngreso(valores)});
cargar();
</script>
